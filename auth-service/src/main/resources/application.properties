spring.application.name=auth
server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=auth_service
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

seed.admin.clave=${SEED_ADMIN_CLAVE:Admin123*}
seed.usuario.clave=${SEED_USUARIO_CLAVE:Usuario123*}
seed.telegram.chat-id=${SEED_TELEGRAM_CHAT_ID:}
