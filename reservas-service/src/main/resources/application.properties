spring.application.name=reservas
server.port=${PORT:8083}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:reservas_service}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

reservas.auth.url=${AUTH_URL:http://localhost:8081}
reservas.canchas.url=${CANCHAS_URL:http://localhost:8082}
reservas.notificaciones.url=${NOTIFICACIONES_URL:http://localhost:8084}
reservas.openmeteo.url=${OPENMETEO_URL:https://api.open-meteo.com/v1}

reservas.timeout-ms=2000
reservas.lluvia.umbral=${LLUVIA_UMBRAL:60}
reservas.clima.cache-minutos=${CLIMA_CACHE_MINUTOS:45}
reservas.clima.max-dias-pronostico=15

reservas.recordatorios.scheduler.enabled=${RECORDATORIOS_SCHEDULER:false}
reservas.recordatorios.cron=0 0 9 * * *

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
