spring.application.name=canchas
server.port=${PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=canchas_service
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

auth.url=${AUTH_URL:http://localhost:8081}
nager.url=${NAGER_URL:https://date.nager.at/api/v3}
http.timeout-ms=${HTTP_TIMEOUT_MS:2000}

tarifa.factor-recargo=${TARIFA_FACTOR_RECARGO:1.20}
