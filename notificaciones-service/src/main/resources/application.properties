spring.application.name=notificaciones-service
server.port=${PORT:8084}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.default_schema=notificaciones_service

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

telegram.api-url=https://api.telegram.org
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.timeout-ms=2000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html

logging.pattern.level=%5p [%X{correlationId:-}]
