spring.application.name=notificaciones-service
# El hosting inyecta PORT; en local queda 8084 (contrato 2.1)
server.port=${PORT:8084}

# Base de datos propia (notificaciones_db). Nada de secretos en el repo.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Telegram (contrato 6.1): timeout de 2 s
telegram.api-url=https://api.telegram.org
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.timeout-ms=2000

# Health check del despliegue: /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Swagger: /swagger-ui.html  y  /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Correlation id en cada linea de log
logging.pattern.level=%5p [%X{correlationId:-}]
